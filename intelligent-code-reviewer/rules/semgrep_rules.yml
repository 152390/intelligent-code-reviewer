# Local Semgrep rules so the prototype works offline. You can also point
# --semgrep-config at a registry pack such as "p/python" or "p/java" (needs internet).
rules:
  - id: sql-injection-string-format
    languages: [python]
    severity: ERROR
    message: SQL query built with string formatting; user input may reach the database unescaped.
    pattern-either:
      - pattern: $CUR.execute(f"...")
      - pattern: $CUR.execute("..." % ...)
      - pattern: $CUR.execute("..." + ...)
      - pattern: $CUR.execute("...".format(...))

  - id: dangerous-eval
    languages: [python]
    severity: ERROR
    message: eval()/exec() on dynamic input can execute arbitrary code.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: subprocess call with shell=True is vulnerable to command injection.
    pattern: subprocess.$F(..., shell=True, ...)

  - id: hardcoded-secret
    languages: [python]
    severity: WARNING
    message: Possible hard-coded secret or credential.
    pattern-regex: (?i)(password|passwd|secret|api_key|apikey|token)\s*=\s*["'][^"']{6,}["']

  - id: pickle-load
    languages: [python]
    severity: WARNING
    message: Unpickling untrusted data can execute arbitrary code.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: java-sql-concat
    languages: [java]
    severity: ERROR
    message: SQL query built by string concatenation; use a PreparedStatement.
    pattern-either:
      - pattern: $S.executeQuery("..." + $X)
      - pattern: $S.execute("..." + $X)
      - pattern: $S.executeUpdate("..." + $X)

  - id: java-string-equals-operator
    languages: [java]
    severity: WARNING
    message: Strings compared with == compare references, not contents; use equals().
    pattern: ($A:String) == ($B:String)
