# Builds the standalone executables for Windows, macOS and Linux on GitHub's machines.
# How to use: push this project to GitHub -> Actions tab -> "Build executables" -> "Run workflow".
# When it finishes, download the zip for your operating system from the run's "Artifacts" section.
name: Build executables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q -k "not demo_pipeline"
      - name: Build
        run: python build.py
      - name: Smoke test the executable
        shell: bash
        run: |
          cd dist/ICR-Reviewer
          ./ICR-Reviewer-cli check
          git config --global user.email ci@example.com
          git config --global user.name CI
          ./ICR-Reviewer-cli demo --path demo_test
          ./ICR-Reviewer-cli review --repo demo_test --base HEAD~1 --out out_test
          rm -rf demo_test out_test
      - uses: actions/upload-artifact@v4
        with:
          name: ICR-Reviewer-${{ runner.os }}
          path: dist/ICR-Reviewer
